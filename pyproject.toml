[project]
name = "polars-root"
version = "0.3.0"
description = "Polars plugin for reading CERN's ROOT file format"
readme = "README.md"
authors = [
	{ name = "Daniel Williams", email = "daniel.mays.williams@gmail.com" },
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["dataframe", "polars", "root"]
classifiers = [
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
	"awkward>=2",
	"awkward>=2.7 ; python_version >= '3.13'",
	"pyarrow>=15",
	"pyarrow>=18 ; python_version >= '3.13'",
	"pyarrow>=23 ; python_version >= '3.14'",
	"uproot>=5.7",
	"polars>=1.34",
]


[project.urls]
Homepage = "https://github.com/DanielMaysWilliams/polars-root"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["coverage>=7", "ipython>=8", "pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
